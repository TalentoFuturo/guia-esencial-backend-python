name: Publicar Libro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del libro (ej. v1.0.0)'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Typst
        uses: typst-community/setup-typst@v4

      - name: Crear carpeta de salida
        run: mkdir -p build

      - name: Compilar libro
        run: typst compile --font-path src/fonts --format pdf src/main.typ build/libro-python-backend.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: libro-python-backend
          path: build/libro-python-backend.pdf
          
      - name: Crear Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/libro-python-backend.pdf
          name: Libro Python Backend ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
